name: 'Build Debian Package'
description: 'Canary: package in build/, plus an invalid .deb in the root'

runs:
  using: 'composite'
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev debhelper build-essential

    - name: Build Debian package
      shell: bash
      run: |
        dpkg-buildpackage -b -uc -us
        mkdir -p build
        mv ../*.deb build/

name: Main Branch CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-main-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests

  version:
    needs: tests
    uses: halos-org/shared-workflows/.github/workflows/release-version.yml@feat/v1-release-pipeline

  build-deb:
    needs: version
    if: needs.version.outputs.due == 'true'
    uses: halos-org/shared-workflows/.github/workflows/build-deb.yml@feat/v1-release-pipeline
    with:
      package-name: halos-browser-trust
      upstream-version: ${{ needs.version.outputs.upstream-version }}
      revision: ${{ needs.version.outputs.revision }}
      apt-distro: trixie
      apt-component: main

  stage-release:
    needs: [version, build-deb]
    uses: halos-org/shared-workflows/.github/workflows/stage-release.yml@feat/v1-release-pipeline
    with:
      package-name: halos-browser-trust
      package-description: Make NSS applications trust the system CA store
      debian-version: ${{ needs.version.outputs.debian-version }}
      prerelease-tag: ${{ needs.version.outputs.prerelease-tag }}
      stable-tag: ${{ needs.version.outputs.stable-tag }}
      artifact: ${{ needs.build-deb.outputs.artifact }}
      apt-repository: halos-org/apt.halos.fi
      apt-distro: trixie
      apt-component: main

  apt-publish:
    needs: stage-release
    uses: halos-org/shared-workflows/.github/workflows/apt-publish.yml@feat/v1-release-pipeline
    with:
      channel: unstable
      apt-repository: halos-org/apt.halos.fi
      apt-distro: trixie
      apt-component: main
    secrets:
      APT_REPO_PAT: ${{ secrets.APT_REPO_PAT }}
